name: Dependency Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
