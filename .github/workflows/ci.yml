name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm-slim
    timeout-minutes: 15

    steps:
      - name: Install CI tools
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes ca-certificates git make python3 zsh
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Makefile flows
        run: |
          make -n install
          make -n upgrade
          make -n clean

      - name: Audit AI assets
        run: |
          python3 ai/audit_assets.py
          repo_dir="$(python3 - <<'PY'
          from pathlib import Path
          import subprocess
          script_dir = Path("ai/audit_assets.py").resolve().parent
          print(subprocess.check_output(["git", "-C", str(script_dir), "rev-parse", "--show-toplevel"], text=True).strip())
          PY
          )"
          if ! git -C "$repo_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            printf "ERROR: could not locate checked-out git repository directory\n" >&2
            exit 1
          fi
          git -C "$repo_dir" diff --exit-code -- ai/audit_report.md

      - name: Validate Python syntax
        run: python3 -m py_compile ai/audit_assets.py

      - name: Validate Zsh syntax
        run: |
          for file in zsh/*.zsh zsh/zprofile zsh/zshrc; do
            zsh -n "$file"
          done
