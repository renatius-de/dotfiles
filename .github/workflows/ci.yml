name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Makefile flows
        run: |
          make -n install
          make -n upgrade
          make -n clean

      - name: Audit AI assets
        run: |
          python3 ai/audit_assets.py
          git diff --exit-code -- ai/audit_report.md

      - name: Validate Python syntax
        run: python3 -m py_compile ai/audit_assets.py

      - name: Validate Zsh syntax
        run: |
          for file in zsh/*.zsh zsh/zprofile zsh/zshrc; do
            zsh -n "$file"
          done
