version: 2

updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
    pull-request-branch-name:
      separator: "-"
